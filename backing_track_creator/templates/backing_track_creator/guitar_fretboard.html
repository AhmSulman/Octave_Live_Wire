{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Fretboard — Octave Live Wire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712;--surface:#0f172a;--glass:rgba(15,23,42,.8);
  --border:rgba(255,255,255,.07);--green:#059669;--green-l:#34d399;
  --cyan:#0891b2;--cyan-l:#38bdf8;--purple:#7c3aed;--purple-l:#a78bfa;
  --gold:#d97706;--gold-l:#fbbf24;--text:#f1f5f9;--muted:#64748b;
  --wood1:#5c3317;--wood2:#7a4520;--wood3:#3d2010;
  --fret-metal:#a0a0b0;
  --string1:#e0e0e8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 2rem;
  background:rgba(3,7,18,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:50;
}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.1rem;
  background:linear-gradient(135deg,var(--green-l),var(--cyan-l));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem 1.1rem;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--muted);font-size:.85rem;text-decoration:none;transition:all .2s}
.back-btn:hover{color:var(--text);background:rgba(255,255,255,.12)}

.layout{flex:1;display:grid;grid-template-columns:260px 1fr;overflow:hidden}

/* Side panel */
.side-panel{
  background:rgba(15,23,42,.6);border-right:1px solid var(--border);
  padding:1.2rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem;
}
.side-panel::-webkit-scrollbar{width:4px}
.side-panel::-webkit-scrollbar-thumb{background:rgba(52,211,153,.3);border-radius:2px}
.panel-title{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green-l);margin-bottom:.5rem}

.select-styled{
  width:100%;padding:.55rem .8rem;border-radius:8px;
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:.84rem;
  outline:none;cursor:pointer;
}
.select-styled:focus{border-color:var(--green-l)}
.select-styled option{background:var(--surface)}

.btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.65rem 1rem;border:none;border-radius:8px;
  font-family:'Space Grotesk',sans-serif;font-size:.83rem;font-weight:700;
  cursor:pointer;transition:all .22s;letter-spacing:.04em;
}
.btn:hover{transform:translateY(-2px)}
.btn-green{background:linear-gradient(135deg,var(--green),#065f46);color:#fff}
.btn-green:hover{box-shadow:0 0 20px rgba(5,150,105,.4)}
.btn-muted{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text)}
.btn-purple{background:linear-gradient(135deg,var(--purple),#4c1d95);color:#fff}
.btn-purple:hover{box-shadow:0 0 20px rgba(124,58,237,.4)}

/* Legend dots */
.legend-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.3rem}
.dot-legend{display:flex;align-items:center;gap:.4rem;font-size:.73rem;color:var(--muted)}
.dot-sample{width:12px;height:12px;border-radius:50%;flex-shrink:0}

/* String labels */
.string-info{display:flex;flex-direction:column;gap:.3rem}
.string-row{display:flex;align-items:center;gap:.7rem;padding:.35rem .5rem;border-radius:6px;background:rgba(255,255,255,.04)}
.string-num{width:16px;text-align:center;font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--muted)}
.string-note{font-weight:700;font-size:.85rem;color:var(--green-l)}
.string-name{font-size:.72rem;color:var(--muted)}

/* Fretboard main area */
.fretboard-area{
  display:flex;flex-direction:column;padding:1rem 1.5rem 1rem;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(5,150,105,.05) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 50%,rgba(8,145,178,.05) 0%,transparent 50%);
}
.fb-controls{
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;
  padding:.7rem 1rem;
  background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:12px;
}
.fb-ctrl-group{display:flex;align-items:center;gap:.5rem}
.fb-ctrl-label{font-size:.72rem;font-weight:600;color:var(--muted);white-space:nowrap}
.fb-select{
  padding:.35rem .6rem;border-radius:6px;
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:var(--text);font-size:.8rem;outline:none;cursor:pointer;
}
.fb-select option{background:var(--surface)}
.scale-tag{display:inline-block;padding:.25rem .7rem;border-radius:999px;font-size:.75rem;font-weight:700;background:rgba(5,150,105,.2);color:var(--green-l);border:1px solid rgba(52,211,153,.3);font-family:'Orbitron',sans-serif}

/* Fretboard container */
.fretboard-scroll{
  flex:1;overflow-x:auto;overflow-y:hidden;
  display:flex;align-items:center;
}
.fretboard-scroll::-webkit-scrollbar{height:6px}
.fretboard-scroll::-webkit-scrollbar-thumb{background:rgba(52,211,153,.3);border-radius:3px}

.fretboard{
  position:relative;flex-shrink:0;
  border-radius:8px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.8),0 0 0 2px var(--wood3);
}

/* Fret numbers row */
.fret-numbers{
  display:flex;height:26px;background:rgba(0,0,0,.5);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.fret-num-cell{
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:600;color:var(--muted);font-family:'Orbitron',sans-serif;
}

/* String row */
.string-row-fb{
  display:flex;align-items:center;position:relative;
  background:linear-gradient(to right,var(--wood1) 0%,var(--wood2) 30%,var(--wood1) 70%,var(--wood3) 100%);
}
.string-row-fb:nth-child(odd){
  background:linear-gradient(to right,#4a2a0f,#6b3b18,#4a2a0f,#332010);
}

/* Nut (open string column) */
.nut-cell{
  width:50px;flex-shrink:0;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(to right,#8a7a6a,#c8b89a,#8a7a6a);
  border-right:4px solid #5a4a3a;
  position:relative;font-size:.75rem;font-weight:700;
  color:var(--wood3);
}

/* Fret cell */
.fret-cell{
  height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;
  border-right:2px solid var(--fret-metal);
  transition:background .15s;
}
.fret-cell:hover{background:rgba(255,255,255,.07)}
.fret-cell::after{
  content:'';position:absolute;left:0;right:0;
  top:50%;transform:translateY(-50%);
  height:var(--sw,1.5px);
  background:var(--string1);
  opacity:.6;
  pointer-events:none;
  box-shadow:0 0 3px rgba(255,255,255,.3);
}
/* String thickness variation */
.string-row-fb:nth-child(2) .fret-cell::after{--sw:3px;opacity:.7}
.string-row-fb:nth-child(3) .fret-cell::after{--sw:2.5px;opacity:.65}
.string-row-fb:nth-child(4) .fret-cell::after{--sw:2px;opacity:.62}
.string-row-fb:nth-child(5) .fret-cell::after{--sw:1.8px;opacity:.6}
.string-row-fb:nth-child(6) .fret-cell::after{--sw:1.5px;opacity:.58}
.string-row-fb:nth-child(7) .fret-cell::after{--sw:1px;opacity:.55}

/* Note dot */
.note-dot{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:800;
  position:relative;z-index:2;
  transition:all .2s;pointer-events:none;
}
.note-dot.root{background:var(--green-l);color:#052e16;box-shadow:0 0 14px rgba(52,211,153,.7)}
.note-dot.third{background:var(--cyan-l);color:#0c2340;box-shadow:0 0 14px rgba(56,189,248,.6)}
.note-dot.fifth{background:var(--purple-l);color:#2e1065;box-shadow:0 0 14px rgba(167,139,250,.6)}
.note-dot.scale{background:rgba(52,211,153,.25);color:var(--green-l);border:1px solid rgba(52,211,153,.5)}
.note-dot.active{
  transform:scale(1.3);
  box-shadow:0 0 24px currentColor !important;
}

/* Fret inlay markers */
.inlay-marker{
  position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.15);
}

/* Position markers band */
.position-markers{
  display:flex;height:20px;background:rgba(0,0,0,.5);
  border-top:1px solid rgba(255,255,255,.06);
}
.pos-marker-cell{
  display:flex;align-items:center;justify-content:center;
  font-size:8px;color:rgba(255,255,255,.25);
}

/* Status bar */
.status-bar{
  margin-top:.8rem;
  display:flex;gap:1rem;align-items:center;
  padding:.6rem 1rem;
  background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:10px;
  font-size:.8rem;color:var(--muted);
  flex-wrap:wrap;
}
.status-note{font-weight:700;color:var(--green-l);font-family:'Orbitron',sans-serif;font-size:1rem}

/* Toast */
.toast{position:fixed;top:75px;right:16px;z-index:200;padding:.65rem 1.2rem;border-radius:10px;font-size:.82rem;font-weight:600;transform:translateX(110%);transition:transform .3s;max-width:260px}
.toast.show{transform:translateX(0)}
.toast-success{background:linear-gradient(135deg,#065f46,#059669);color:#fff}
.toast-error{background:linear-gradient(135deg,#7f1d1d,#ef4444);color:#fff}
.toast-info{background:linear-gradient(135deg,rgba(15,23,42,.9),rgba(5,150,105,.3));color:#fff;border:1px solid rgba(52,211,153,.3)}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .side-panel{display:none}
  body{overflow:auto;height:auto}
}
</style>
<script defer src="https://cdn.vercel-analytics.com/v1/script.js"></script>

<body>
<div class="topbar">
  <div class="logo">🎸 GUITAR FRETBOARD</div>
  <div style="display:flex;gap:.7rem;align-items:center">
    <a href="{% url 'backing_track_creator:piano_learner' %}" class="back-btn">🎹 Piano</a>
    <a href="{% url 'backing_track_creator:home' %}" class="back-btn">← Home</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="layout">
  <!-- Side Panel -->
  <div class="side-panel">
    <div>
      <div class="panel-title">Guitar Tuning</div>
      <select class="select-styled" id="tuningSelect" onchange="loadFretboard()">
        {% for t in tunings %}
        <option value="{{ t.name }}" {% if t.name == current_tuning.name %}selected{% endif %}>{{ t.display }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <div class="panel-title">Scale / Mode</div>
      <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
        <select class="select-styled" id="scaleRoot" onchange="applyScale()" style="flex:1">
          <option value="C">C</option>
          <option value="Db">Db</option>
          <option value="D">D</option>
          <option value="Eb">Eb</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="Gb">Gb</option>
          <option value="G">G</option>
          <option value="Ab">Ab</option>
          <option value="A" selected>A</option>
          <option value="Bb">Bb</option>
          <option value="B">B</option>
        </select>
        <select class="select-styled" id="scaleType" onchange="applyScale()" style="flex:2">
          <option value="pentatonic_minor" selected>Pentatonic Minor</option>
          <option value="pentatonic_major">Pentatonic Major</option>
          <option value="major">Major</option>
          <option value="minor">Natural Minor</option>
          <option value="blues">Blues</option>
          <option value="dorian">Dorian</option>
          <option value="phrygian">Phrygian</option>
          <option value="mixolydian">Mixolydian</option>
          <option value="none">No Scale</option>
        </select>
      </div>
      <div class="legend-row">
        <div class="dot-legend"><div class="dot-sample" style="background:var(--green-l)"></div> Root</div>
        <div class="dot-legend"><div class="dot-sample" style="background:var(--cyan-l)"></div> 3rd</div>
        <div class="dot-legend"><div class="dot-sample" style="background:var(--purple-l)"></div> 5th</div>
        <div class="dot-legend"><div class="dot-sample" style="background:rgba(52,211,153,.3);border:1px solid rgba(52,211,153,.5)"></div> Scale</div>
      </div>
    </div>

    <div>
      <div class="panel-title">String Tuning</div>
      <div class="string-info" id="stringInfo"></div>
    </div>

    <div>
      <div class="panel-title">Controls</div>
      <div style="display:flex;flex-direction:column;gap:.5rem">
        <button class="btn btn-green" onclick="applyScale()">🎯 Show Scale</button>
        <button class="btn btn-muted" onclick="clearDots()">✕ Clear Dots</button>
        <button class="btn btn-purple" onclick="loadFretboard()">🔄 Refresh</button>
      </div>
    </div>

    <div>
      <div class="panel-title">Quick Chords</div>
      <div style="display:flex;flex-direction:column;gap:.4rem" id="quickChords"></div>
    </div>
  </div>

  <!-- Fretboard Area -->
  <div class="fretboard-area">
    <div class="fb-controls">
      <div class="fb-ctrl-group">
        <span class="fb-ctrl-label">Tuning:</span>
        <select class="fb-select" id="tuningSelectTop" onchange="syncTuning(this.value)">
          {% for t in tunings %}
          <option value="{{ t.name }}" {% if t.name == current_tuning.name %}selected{% endif %}>{{ t.display }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="fb-ctrl-group">
        <span class="fb-ctrl-label">Frets:</span>
        <select class="fb-select" id="fretCount" onchange="loadFretboard()">
          <option value="12">12</option>
          <option value="17" selected>17</option>
          <option value="22">22</option>
          <option value="24">24</option>
        </select>
      </div>
      <div class="fb-ctrl-group">
        <span class="fb-ctrl-label">Labels:</span>
        <select class="fb-select" id="labelMode" onchange="applyScale()">
          <option value="note">Note Name</option>
          <option value="interval">Interval</option>
          <option value="none">None</option>
        </select>
      </div>
      <span class="scale-tag" id="scaleTag">A Pentatonic Minor</span>
    </div>

    <div class="fretboard-scroll">
      <div id="fretboardWrap"></div>
    </div>

    <div class="status-bar">
      <span id="statusNote" class="status-note">—</span>
      <span>|</span>
      <span id="statusString"></span>
      <span id="statusFret"></span>
      <span id="statusInterval"></span>
    </div>
  </div>
</div>

<script>
const NOTE_NAMES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SCALE_INTERVALS = {
  pentatonic_minor:[0,3,5,7,10],
  pentatonic_major:[0,2,4,7,9],
  major:[0,2,4,5,7,9,11],
  minor:[0,2,3,5,7,8,10],
  blues:[0,3,5,6,7,10],
  dorian:[0,2,3,5,7,9,10],
  phrygian:[0,1,3,5,7,8,10],
  mixolydian:[0,2,4,5,7,9,10],
  none:[],
};
const INTERVAL_NAMES = {0:'R',2:'2',3:'b3',4:'3',5:'4',6:'b5',7:'5',8:'b6',9:'6',10:'b7',11:'7'};

const PIANO_BASE = "{% static 'Piano/' %}";

let fretboardData = null;
let audioCtx = null;

// noteId → AudioBuffer (ready to play)
const pianoBuffers = new Map();
// noteId → ArrayBuffer (fetched, awaiting AudioContext to decode)
const pianoRaw = new Map();

function noteToMidi(noteStr){
  const flat = noteStr.replace('#','').trim();
  let name, octave;
  if(flat.length >= 3 && flat[1]==='b'){name=flat.slice(0,2);octave=parseInt(flat.slice(2));}
  else{name=flat[0];octave=parseInt(flat.slice(1));}
  return (octave+1)*12 + NOTE_NAMES.indexOf(name);
}
function midiToFreq(m){ return 440 * Math.pow(2,(m-69)/12); }

// Stage 1 — fetch WAV bytes in the background, no AudioContext needed
async function fetchPianoSamples(noteIds){
  const fresh = noteIds.filter(id => !pianoRaw.has(id) && !pianoBuffers.has(id));
  if(!fresh.length) return;
  await Promise.allSettled(fresh.map(async id => {
    try {
      const r = await fetch(PIANO_BASE + `Piano.pp.${id}.wav`);
      if(r.ok) pianoRaw.set(id, await r.arrayBuffer());
    } catch(_){}
  }));
}

// Stage 2 — decode fetched ArrayBuffers once AudioContext exists (called on first click)
async function decodePending(){
  if(!audioCtx || !pianoRaw.size) return;
  for(const [id, ab] of [...pianoRaw]){
    try {
      pianoBuffers.set(id, await audioCtx.decodeAudioData(ab));
      pianoRaw.delete(id);
    } catch(_){}
  }
}

// Find a decoded buffer in a nearby octave for pitch-shifting when exact note is absent
function nearestBuffer(noteStr){
  const m = noteStr.match(/^([A-G]b?)(\d+)$/);
  if(!m) return null;
  const [, name, oct] = m;
  const o = parseInt(oct);
  for(let d = 1; d <= 4; d++){
    for(const sign of [1, -1]){
      const candidate = name + (o + sign * d);
      if(pianoBuffers.has(candidate)) return { buf: pianoBuffers.get(candidate), semitones: sign * d * 12 };
    }
  }
  return null;
}

function playSampleBuf(buf, semitoneOffset = 0){
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  if(semitoneOffset) src.playbackRate.value = Math.pow(2, semitoneOffset / 12);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.75, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

function playOscillatorFallback(noteStr){
  const midi = noteToMidi(noteStr);
  const freq = midiToFreq(midi);
  const masterGain = audioCtx.createGain();
  masterGain.connect(audioCtx.destination);
  masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.01);
  masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  [[1,.7,'triangle'],[2,.15,'sine']].forEach(([r,a,t])=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = t; o.frequency.value = freq * r; g.gain.value = a;
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(audioCtx.currentTime + 2);
  });
}

function playFretTone(noteStr){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    decodePending(); // async, doesn't block
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();

  // Best case: exact decoded buffer
  if(pianoBuffers.has(noteStr)){ playSampleBuf(pianoBuffers.get(noteStr)); return; }

  // Note was fetched but not yet decoded — decode it now and play immediately
  const raw = pianoRaw.get(noteStr);
  if(raw){
    audioCtx.decodeAudioData(raw.slice(0)).then(decoded => {
      pianoBuffers.set(noteStr, decoded);
      pianoRaw.delete(noteStr);
      playSampleBuf(decoded);
    }).catch(() => playOscillatorFallback(noteStr));
    return;
  }

  // No file for this note — pitch-shift from nearest available octave
  const near = nearestBuffer(noteStr);
  if(near){ playSampleBuf(near.buf, near.semitones); return; }

  // Ultimate fallback: synthetic oscillator
  playOscillatorFallback(noteStr);
}

async function loadFretboard(){
  const tuning = document.getElementById('tuningSelectTop').value;
  document.getElementById('tuningSelect').value = tuning;
  const frets = parseInt(document.getElementById('fretCount').value);

  const wrap = document.getElementById('fretboardWrap');
  wrap.innerHTML = '<div style="padding:2rem;color:var(--muted);font-size:.9rem"><span class="spinner"></span> Loading fretboard...</div>';

  try {
    const res = await fetch(`{% url 'backing_track_creator:fretboard_data' %}?tuning=${tuning}&frets=${frets}`);
    fretboardData = await res.json();
    if(!fretboardData.success) throw new Error(fretboardData.error);

    buildFretboard();
    updateStringInfo();
    applyScale();
    showToast(`Loaded: ${fretboardData.tuning}`, 'success');

    // Background-fetch WAV samples for every note on this fretboard
    const noteIds = [...new Set(fretboardData.strings.flatMap(s => s.frets.map(f => f.note)))];
    fetchPianoSamples(noteIds);
  } catch(e){
    wrap.innerHTML = `<div style="padding:2rem;color:#ef4444">Error: ${e.message}</div>`;
  }
}

function buildFretboard(){
  const frets = fretboardData.frets;
  const strings = fretboardData.strings;
  const FRET_W = 56, NUT_W = 50, STRING_H = 52;
  const fbW = NUT_W + frets * FRET_W;

  const fb = document.createElement('div');
  fb.className = 'fretboard';
  fb.style.width = fbW + 'px';

  // Fret numbers
  const numRow = document.createElement('div');
  numRow.className = 'fret-numbers';
  const nutNum = document.createElement('div');
  nutNum.className = 'fret-num-cell';
  nutNum.style.width = NUT_W + 'px';
  nutNum.style.flexShrink = '0';
  nutNum.textContent = '0';
  numRow.appendChild(nutNum);
  for(let f = 1; f <= frets; f++){
    const c = document.createElement('div');
    c.className = 'fret-num-cell';
    c.style.cssText = `width:${FRET_W}px;flex-shrink:0`;
    c.textContent = f;
    numRow.appendChild(c);
  }
  fb.appendChild(numRow);

  // String rows
  const INLAY_FRETS = [3,5,7,9,12,15,17];
  strings.forEach((str, si) => {
    const row = document.createElement('div');
    row.className = 'string-row-fb';
    row.dataset.string = si;

    // Nut cell (open string)
    const nutCell = document.createElement('div');
    nutCell.className = 'nut-cell';
    nutCell.style.width = NUT_W + 'px';
    const od = str.frets[0];
    nutCell.dataset.noteid = od.note;
    nutCell.dataset.fret = '0';
    nutCell.dataset.string = si;
    nutCell.textContent = od.note.replace(/\d/, '');
    nutCell.style.cursor = 'pointer';
    nutCell.addEventListener('click', () => handleFretClick(nutCell, od.note, si, 0));
    row.appendChild(nutCell);

    // Fret cells
    for(let f = 1; f <= frets; f++){
      const cell = document.createElement('div');
      cell.className = 'fret-cell';
      cell.style.cssText = `width:${FRET_W}px;flex-shrink:0`;
      const fd = str.frets[f];
      cell.dataset.noteid = fd.note;
      cell.dataset.fret = f;
      cell.dataset.string = si;

      // Inlay markers on middle string (string 2)
      if(si === 2 && INLAY_FRETS.includes(f)){
        const inlay = document.createElement('div');
        inlay.className = 'inlay-marker';
        if(f === 12) inlay.style.cssText = 'width:14px;height:6px;border-radius:3px';
        cell.appendChild(inlay);
      }

      cell.addEventListener('click', () => handleFretClick(cell, fd.note, si, f));
      row.appendChild(cell);
    }
    fb.appendChild(row);
  });

  // Position markers
  const posRow = document.createElement('div');
  posRow.className = 'position-markers';
  const nutPos = document.createElement('div');
  nutPos.className = 'pos-marker-cell';
  nutPos.style.cssText = `width:${NUT_W}px;flex-shrink:0`;
  posRow.appendChild(nutPos);
  for(let f = 1; f <= frets; f++){
    const c = document.createElement('div');
    c.className = 'pos-marker-cell';
    c.style.cssText = `width:${FRET_W}px;flex-shrink:0`;
    if([3,5,7,9,12,15,17].includes(f)) c.textContent = '●';
    posRow.appendChild(c);
  }
  fb.appendChild(posRow);

  document.getElementById('fretboardWrap').innerHTML = '';
  document.getElementById('fretboardWrap').appendChild(fb);
}

function handleFretClick(cell, note, stringIdx, fret){
  playFretTone(note);
  cell.classList.add('active');
  setTimeout(() => cell.classList.remove('active'), 600);

  // Status bar
  const cleanNote = note.replace(/\d/,'');
  document.getElementById('statusNote').textContent = note;
  document.getElementById('statusString').textContent = `String ${stringIdx+1}`;
  document.getElementById('statusFret').textContent = fret === 0 ? '· Open' : `· Fret ${fret}`;

  // Interval
  const root = document.getElementById('scaleRoot').value;
  const rootIdx = NOTE_NAMES.indexOf(root);
  const noteIdx = NOTE_NAMES.indexOf(cleanNote);
  const interval = ((noteIdx - rootIdx) + 12) % 12;
  const intName = INTERVAL_NAMES[interval] || '';
  document.getElementById('statusInterval').textContent = intName ? `· ${intName}` : '';

  showToast(`${note}  ${intName ? '— ' + intName : ''}`, 'info');
}

function applyScale(){
  if(!fretboardData) return;
  const root = document.getElementById('scaleRoot').value;
  const type = document.getElementById('scaleType').value;
  const labelMode = document.getElementById('labelMode').value;
  const intervals = SCALE_INTERVALS[type] || [];
  const rootIdx = NOTE_NAMES.indexOf(root);
  const scaleSet = intervals.map(i => NOTE_NAMES[(rootIdx + i) % 12]);

  // Scale name tag
  const scaleNames = {
    pentatonic_minor:'Pentatonic Minor',pentatonic_major:'Pentatonic Major',
    major:'Major',minor:'Natural Minor',blues:'Blues',dorian:'Dorian',phrygian:'Phrygian',mixolydian:'Mixolydian',none:'No Scale'
  };
  document.getElementById('scaleTag').textContent = `${root} ${scaleNames[type] || ''}`;

  // Clear all dots
  document.querySelectorAll('.note-dot').forEach(d => d.remove());

  if(type === 'none') return;

  // Draw dots
  document.querySelectorAll('[data-noteid]').forEach(cell => {
    const note = cell.dataset.noteid;
    const cleanNote = note.replace(/\d/,'');
    if(!scaleSet.includes(cleanNote)) return;

    const noteIdx = NOTE_NAMES.indexOf(cleanNote);
    const interval = ((noteIdx - rootIdx) + 12) % 12;
    const dot = document.createElement('div');
    dot.className = 'note-dot';

    if(cleanNote === root) dot.classList.add('root');
    else if(interval === 4 || interval === 3) dot.classList.add('third');
    else if(interval === 7) dot.classList.add('fifth');
    else dot.classList.add('scale');

    // Label
    if(labelMode === 'note') dot.textContent = cleanNote;
    else if(labelMode === 'interval') dot.textContent = INTERVAL_NAMES[interval] || '';

    cell.appendChild(dot);
  });
}

function clearDots(){
  document.querySelectorAll('.note-dot').forEach(d => d.remove());
  document.getElementById('scaleTag').textContent = 'No Scale';
}

function updateStringInfo(){
  if(!fretboardData) return;
  const info = document.getElementById('stringInfo');
  const stringNames = ['1st (High)','2nd','3rd','4th','5th','6th (Low)'];
  info.innerHTML = fretboardData.strings.map((s, i) => `
    <div class="string-row">
      <span class="string-num">${i+1}</span>
      <span class="string-note">${s.open_note}</span>
      <span class="string-name">${stringNames[i]||''}</span>
    </div>`).join('');
}

function syncTuning(val){
  document.getElementById('tuningSelect').value = val;
  loadFretboard();
}

// Quick chords
const QUICK_CHORDS = {
  'Am':{root:'A',intervals:[0,3,7]},
  'Em':{root:'E',intervals:[0,3,7]},
  'G':{root:'G',intervals:[0,4,7]},
  'C':{root:'C',intervals:[0,4,7]},
  'D':{root:'D',intervals:[0,4,7]},
  'F':{root:'F',intervals:[0,4,7]},
};

document.getElementById('quickChords').innerHTML = Object.entries(QUICK_CHORDS).map(([name,data]) =>
  `<button class="btn btn-muted" style="font-size:.78rem;padding:.5rem" onclick="highlightChord('${name}','${data.root}',${JSON.stringify(data.intervals)})">${name}</button>`
).join('');

function highlightChord(name, root, intervals){
  const rootIdx = NOTE_NAMES.indexOf(root);
  const notes = intervals.map(i => NOTE_NAMES[(rootIdx+i)%12]);
  document.querySelectorAll('.note-dot').forEach(d => d.remove());
  document.querySelectorAll('[data-noteid]').forEach(cell => {
    const note = cell.dataset.noteid.replace(/\d/,'');
    if(!notes.includes(note)) return;
    const intv = ((NOTE_NAMES.indexOf(note) - rootIdx)+12)%12;
    const dot = document.createElement('div');
    dot.className = 'note-dot';
    if(note === root) dot.classList.add('root');
    else if(intv === 4||intv === 3) dot.classList.add('third');
    else dot.classList.add('fifth');
    const lm = document.getElementById('labelMode').value;
    if(lm==='note') dot.textContent=note;
    else if(lm==='interval') dot.textContent = INTERVAL_NAMES[intv]||'';
    cell.appendChild(dot);
  });
  document.getElementById('scaleTag').textContent = name + ' chord';
  showToast('Showing ' + name + ' chord', 'info');
}

function showToast(msg, type='info'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast toast-${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init
loadFretboard();
</script>
